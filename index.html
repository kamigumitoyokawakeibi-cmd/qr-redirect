<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>読み込み中...</title>
</head>
<body style="background-color: #f8f9fa; text-align: center; padding-top: 50px; font-family: sans-serif;">
    <p>安全なページへ移動しています...</p>
    <p style="font-size: 14px; color: #666;">
        画面が切り替わらない場合は<a id="gasLink" href="#">こちら</a>をタップしてください。
    </p>

    <script>
        // 1. ★来訪者用★ GASの基本URL（?mode=exit 等より前の部分）を貼り付けてください
        const gasBaseUrl = "https://script.google.com/macros/s/AKfycbzaKnAvvjzEQwMVl9wKBwSw0lcQA4BDEt9UT2s0Oq5AfMWbsndvwC1E92DgnNJh2L_BNw/exec";

        // 2. QRコードから読み取ったパラメータ（?no=〇〇）を取得
        const urlParams = new URLSearchParams(window.location.search);
        let noParam = urlParams.get('no');

        // 3. 【自動変換システム】古い番号(1-900等)が来たら、新しい番号(800等)に変換する
        if (noParam) {
            let parts = noParam.split("-");
            // もし「1-900」のようなハイフン付きの古い形式だった場合のみ変換を実行
            if (parts.length === 2) {
                let prefix = parts[0];
                let num = parseInt(parts[1], 10);
                
                if (prefix === "1" && num >= 900 && num <= 930) {
                    noParam = String(num - 100); // 例: 1-900 → 800
                } else if (prefix === "2" && num >= 900 && num <= 930) {
                    noParam = String(num);       // 例: 2-900 → 900
                } else if (prefix === "3" && num >= 900 && num <= 930) {
                    noParam = String(num + 100); // 例: 3-900 → 1000
                }
            }
        }

        // 4. 転送先の最終URLを合体させる
        let finalUrl = gasBaseUrl + "?mode=exit";
        if (noParam) {
            finalUrl += "&no=" + noParam;
        }

        // 5. 万が一のための手動リンクにURLをセット
        document.getElementById("gasLink").href = finalUrl;

        // 6. プログラムによる自動転送（ここでアプリ強制起動を回避！）
        window.location.replace(finalUrl);
    </script>
</body>
</html>
